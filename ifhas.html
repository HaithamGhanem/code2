    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f6f9;
            color: #1f2937;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            width: 100%;
            max-width: none;
            margin: 0 auto;
            padding: 28px 32px 60px;
        }

        /* --------------------------------
           Page Header
        -------------------------------- */

        .page-header {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 25px 28px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.04);
        }

        .page-header h1 {
            margin: 0 0 6px;
            font-size: 26px;
            color: #111827;
        }

        .page-header p {
            margin: 0;
            font-size: 14px;
            color: #6b7280;
        }

        /* --------------------------------
           Toolbar
        -------------------------------- */

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .toolbar-label {
            font-size: 13px;
            color: #6b7280;
        }

        .toolbar-buttons {
            display: flex;
            gap: 8px;
        }

        .btn {
            border: 0;
            border-radius: 7px;
            padding: 9px 15px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        .btn-expand {
            background: #2563eb;
            color: #ffffff;
        }

        .btn-expand:hover {
            background: #1d4ed8;
        }

        .btn-collapse {
            background: #e5e7eb;
            color: #374151;
        }

        .btn-collapse:hover {
            background: #d1d5db;
        }

        /* --------------------------------
           Package
        -------------------------------- */

        .package-group {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            margin-bottom: 18px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.035);
        }

        .package-summary {
            padding: 17px 20px;
            background: #f9fafb;
            cursor: pointer;
            list-style: none;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .package-info {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .package-icon {
            width: 38px;
            height: 38px;
            flex: 0 0 38px;
            border-radius: 9px;
            background: #eef2ff;
            color: #4f46e5;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 17px;
        }

        .package-text {
            min-width: 0;
        }

        .package-title {
            font-size: 15px;
            font-weight: bold;
            color: #111827;
            word-break: break-all;
        }

        .package-count {
            margin-top: 3px;
            font-size: 12px;
            color: #9ca3af;
        }

        .package-arrow {
            color: #9ca3af;
            font-size: 17px;
            transition: transform 0.2s;
        }

        .package-group .package-arrow {
            transform: rotate(180deg);
        }

        .package-group.is-collapsed .package-arrow {
            transform: rotate(0deg);
        }

        /* --------------------------------
           Package Content
        -------------------------------- */

        .package-content {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            padding: 9px;
        }

        /* --------------------------------
           Labs / Radiology
        -------------------------------- */

        .category {
            flex: 1 1 340px;
            min-width: 0;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            margin: 6px;
            overflow: hidden;
            background: #ffffff;
        }

        .category-summary {
            list-style: none;
            cursor: pointer;
            padding: 15px 17px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .category-summary::-webkit-details-marker {
            display: none;
        }

        .category-summary:hover {
            background: #f9fafb;
        }

        .category-info {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .category-icon {
            width: 34px;
            height: 34px;
            border-radius: 8px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 15px;
        }

        .labs-icon {
            background: #ecfdf5;
            color: #059669;
        }

        .radiology-icon {
            background: #fef3c7;
            color: #d97706;
        }

        .general-icon {
            background: #eef2ff;
            color: #4f46e5;
        }

        .category-title {
            font-size: 14px;
            font-weight: bold;
            color: #374151;
        }

        .category-count {
            margin-top: 3px;
            font-size: 12px;
            color: #9ca3af;
        }

        .category-arrow {
            color: #9ca3af;
            transition: transform 0.2s;
        }

        .category .category-arrow {
            transform: rotate(180deg);
        }

        .category.is-collapsed .category-arrow {
            transform: rotate(0deg);
        }

        /* --------------------------------
           Orders
        -------------------------------- */

        .orders {
            padding: 0 12px 12px;
        }

        .orders-inner {
            display: flex;
            flex-wrap: wrap;
            border-top: 1px solid #f1f3f5;
            padding-top: 6px;
            margin: 0 -4px;
        }

        .order {
            display: block;

            flex: 1 1 300px;
            min-width: 0;

            padding: 13px 14px;
            margin: 6px 4px;

            background: #f9fafb;
            border: 1px solid #edf0f2;
            border-radius: 8px;
        }

        .order-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .order-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .order-icon {
            width: 28px;
            height: 28px;
            flex: 0 0 28px;

            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 6px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 12px;
        }

        .order-name {
            font-size: 13px;
            font-weight: bold;
            color: #374151;
            word-wrap: break-word;
        }

        .order-details {
            display: flex;
            flex-wrap: wrap;

            margin: 10px 0 0;
            padding-top: 8px;

            border-top: 1px solid #edf0f2;
        }

        .order-detail {
            flex: 1 1 130px;
            min-width: 0;

            padding: 3px 10px 3px 0;
        }

        .order-detail-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: #9ca3af;
        }

        .order-detail-value {
            margin-top: 2px;
            font-size: 12px;
            color: #4b5563;
            word-wrap: break-word;
            word-break: break-word;
        }

        .order-status {
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
        }

        .status-completed {
            background: #dcfce7;
            color: #15803d;
        }

        .status-pending {
            background: #fef3c7;
            color: #a16207;
        }

        .status-cancelled {
            background: #fee2e2;
            color: #b91c1c;
        }

        /* --------------------------------
           Empty
        -------------------------------- */

        .empty {
            padding: 20px;
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
        }

        /* --------------------------------
           Mobile
        -------------------------------- */

        @media (max-width: 900px) {

            .category {
                flex-basis: 100%;
            }
        }

        @media (max-width: 650px) {

            .page {
                padding: 20px 12px 40px;
            }

            .toolbar {
                align-items: flex-start;
                flex-direction: column;
                gap: 10px;
            }

            .toolbar-buttons {
                width: 100%;
            }

            .btn {
                flex: 1;
            }

            .order-top {
                align-items: flex-start;
                gap: 10px;
            }

            .order-status {
                margin-top: 2px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="page-header">
        <h1>IFHAS Orders</h1>
        <p>Orders grouped by package number, then by catalog type.</p>
    </div>

    <div class="toolbar">
        <div class="toolbar-label">
            Orders are expanded by default
        </div>

        <div class="toolbar-buttons">
            <button type="button"
                    class="btn btn-expand"
                    id="expandAll">
                Expand All
            </button>

            <button type="button"
                    class="btn btn-collapse"
                    id="collapseAll">
                Collapse All
            </button>
        </div>
    </div>

    <!--

    -->

    <div id="ordersContainer"></div>

</div>


<script>
(function () {

    /*

                }

        }
    };


    /*
     * =========================================================
     * HELPERS
     * =========================================================
     */

    function escapeHtml(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    function getStatusClass(status) {

        var value = String(status).toLowerCase();

        if (value === "completed") {
            return "status-completed";
        }

        if (value === "pending") {
            return "status-pending";
        }

        if (value === "cancelled") {
            return "status-cancelled";
        }

        return "";
    }


    /*
     * =========================================================
     * BUILD ORDER HTML
     * =========================================================
     */

    /*
     * =========================================================
     * ORDER DETAILS
     * =========================================================
     *
     * Every field on the order row is shown except ORDER_NAME
     * and ORDER_STATUS, which are already the title and badge.
     *
     */

    var ORDER_DETAIL_LABELS = {
        FIN: "FIN",
        ORDER_DATE: "Order Date",
        CATALOG_TYPE: "Catalog Type",
        PACKAGE_NUMBER: "Package Number"
    };


    var ORDER_DETAIL_HIDDEN = {
        ORDER_NAME: true,
        ORDER_STATUS: true
    };


    function formatFieldLabel(key) {

        if (ORDER_DETAIL_LABELS[key]) {
            return ORDER_DETAIL_LABELS[key];
        }

        return key
            .replace(/_/g, " ")
            .toLowerCase()
            .replace(/\b\w/g, function (character) {
                return character.toUpperCase();
            });
    }


    function buildOrderDetails(order) {

        var html = '<div class="order-details">';
        var key;

        for (key in order) {

            if (
                !order.hasOwnProperty(key) ||
                ORDER_DETAIL_HIDDEN[key]
            ) {
                continue;
            }

            html +=
                '<div class="order-detail">' +

                    '<div class="order-detail-label">' +
                        escapeHtml(formatFieldLabel(key)) +
                    '</div>' +

                    '<div class="order-detail-value">' +
                        escapeHtml(order[key]) +
                    '</div>' +

                '</div>';
        }

        html += '</div>';

        return html;
    }


    /*
     * =========================================================
     * BUILD ORDER HTML
     * =========================================================
     */

    function buildOrder(order) {

        return (
            '<div class="order">' +

                '<div class="order-top">' +

                    '<div class="order-left">' +

                        '<div class="order-icon">' +
                            '&#10004;' +
                        '</div>' +

                        '<div class="order-name">' +
                            escapeHtml(order.ORDER_NAME) +
                        '</div>' +

                    '</div>' +

                    '<div class="order-status ' +
                        getStatusClass(order.ORDER_STATUS) +
                    '">' +
                        escapeHtml(order.ORDER_STATUS) +
                    '</div>' +

                '</div>' +

                buildOrderDetails(order) +

            '</div>'
        );
    }


    /*
     * =========================================================
     * CATALOG TYPE ICON
     * =========================================================
     */

    function getCatalogIcon(type) {

        var value = String(type).toLowerCase();

        if (
            value === "laboratory" ||
            value === "lab" ||
            value === "labs"
        ) {
            return {
                className: "labs-icon",
                icon: "&#129514;"
            };
        }

        if (value === "radiology") {
            return {
                className: "radiology-icon",
                icon: "&#9762;"
            };
        }

        return {
            className: "general-icon",
            icon: "&#128203;"
        };
    }


    /*
     * =========================================================
     * BUILD CATEGORY
     * =========================================================
     */

    function buildCategory(type, orders) {

        if (orders.length === 0) {
            return "";
        }

        var iconInfo = getCatalogIcon(type);

        var html = "";

        html += '<div class="category toggle-group">';

        html +=
            '<div class="category-summary">' +

                '<div class="category-info">' +

                    '<div class="category-icon ' +
                        iconInfo.className +
                    '">' +
                        iconInfo.icon +
                    '</div>' +

                    '<div>' +

                        '<div class="category-title">' +
                            escapeHtml(type) +
                        '</div>' +

                        '<div class="category-count">' +
                            orders.length +
                            ' order' +
                            (orders.length === 1 ? "" : "s") +
                        '</div>' +

                    '</div>' +

                '</div>' +

                '<div class="category-arrow">&#9660;</div>' +

            '</div>';


        html += '<div class="orders group-content">';
        html += '<div class="orders-inner">';


        var i;

        for (i = 0; i < orders.length; i++) {
            html += buildOrder(orders[i]);
        }


        html += '</div>';
        html += '</div>';

        html += '</div>';

        return html;
    }


    /*
     * =========================================================
     * GROUP BY PACKAGE NUMBER, THEN BY CATALOG TYPE
     * =========================================================
     */

    function groupOrders(rows) {

        var packages = [];
        var packageIndex = {};
        var i;

        for (i = 0; i < rows.length; i++) {

            var row = rows[i];

            var packageKey = "_" + row.PACKAGE_NUMBER;
            var typeKey = "_" + row.CATALOG_TYPE;

            var pkg = packageIndex[packageKey];

            if (!pkg) {

                pkg = {
                    packageNumber: row.PACKAGE_NUMBER,
                    types: [],
                    typeIndex: {},
                    totalCount: 0
                };

                packageIndex[packageKey] = pkg;
                packages.push(pkg);
            }

            var group = pkg.typeIndex[typeKey];

            if (!group) {

                group = {
                    type: row.CATALOG_TYPE,
                    orders: []
                };

                pkg.typeIndex[typeKey] = group;
                pkg.types.push(group);
            }

            group.orders.push(row);
            pkg.totalCount++;
        }

        return packages;
    }


    /*
     * =========================================================
     * BUILD PACKAGE
     * =========================================================
     */

    function buildPackage(pkg) {

        if (pkg.totalCount === 0) {
            return "";
        }

        var html = "";

        html += '<div class="package-group toggle-group">';

        html +=
            '<div class="package-summary">' +

                '<div class="package-info">' +

                    '<div class="package-icon">' +
                        '&#128230;' +
                    '</div>' +

                    '<div class="package-text">' +

                        '<div class="package-title">' +
                            escapeHtml(pkg.packageNumber) +
                        '</div>' +

                        '<div class="package-count">' +
                            pkg.totalCount +
                            ' total order' +
                            (pkg.totalCount === 1 ? "" : "s") +
                        '</div>' +

                    '</div>' +

                '</div>' +

                '<div class="package-arrow">&#9660;</div>' +

            '</div>';


        html += '<div class="package-content group-content">';

        var i;

        for (i = 0; i < pkg.types.length; i++) {

            html += buildCategory(
                pkg.types[i].type,
                pkg.types[i].orders
            );
        }

        html += '</div>';

        html += '</div>';

        return html;
    }


    /*
     * =========================================================
     * RENDER EVERYTHING
     * =========================================================
     */

    function render() {

        var container =
            document.getElementById("ordersContainer");

        var rows = [];

        if (
            ordersData &&
            ordersData.IFHAS &&
            ordersData.IFHAS.QUAL
        ) {
            rows = ordersData.IFHAS.QUAL;
        }

        var packages = groupOrders(rows);

        var html = "";
        var i;

        for (i = 0; i < packages.length; i++) {

            html += buildPackage(
                packages[i]
            );
        }

        container.innerHTML = html;
    }


    /*
     * =========================================================
     * ES5 HELPERS
     * =========================================================
     */

    function hasClass(element, name) {

        return (
            (" " + element.className + " ").indexOf(" " + name + " ") !== -1
        );
    }


    function addClass(element, name) {

        if (!hasClass(element, name)) {

            element.className += (
                (element.className ? " " : "") + name
            );
        }
    }


    function removeClass(element, name) {

        var pattern = new RegExp("(^|\\s)" + name + "(\\s|$)");

        element.className = element.className
            .replace(pattern, " ")
            .replace(/^\s+/, "")
            .replace(/\s+$/, "");
    }


    function getByClassName(className) {

        var all =
            document.getElementsByTagName("*");

        var result = [];
        var i;

        for (i = 0; i < all.length; i++) {

            if (hasClass(all[i], className)) {
                result.push(all[i]);
            }
        }

        return result;
    }


    /*
     * =========================================================
     * EXPAND / COLLAPSE ONE GROUP
     * =========================================================
     */

    function getGroupContent(group) {

        var all = group.getElementsByTagName("*");
        var i;

        for (i = 0; i < all.length; i++) {

            if (
                hasClass(all[i], "date-content") ||
                hasClass(all[i], "orders")
            ) {
                return all[i];
            }
        }

        return null;
    }


    function isCollapsed(group) {

        return hasClass(group, "is-collapsed");
    }


    function setGroupOpen(group, isOpen) {

        var content = getGroupContent(group);

        if (!content) {
            return;
        }

        if (isOpen) {

            removeClass(group, "is-collapsed");
            content.style.display = "";

        } else {

            addClass(group, "is-collapsed");
            content.style.display = "none";
        }
    }


    /*
     * =========================================================
     * EXPAND / COLLAPSE ALL
     * =========================================================
     */

    function setAllOpen(isOpen) {

        var groups =
            getByClassName("toggle-group");

        var i;

        for (i = 0; i < groups.length; i++) {

            setGroupOpen(groups[i], isOpen);
        }
    }


    /*
     * =========================================================
     * BIND TOGGLE HANDLERS
     * =========================================================
     */

    function initToggles() {

        var groups =
            getByClassName("toggle-group");

        var i;

        for (i = 0; i < groups.length; i++) {

            (function (group) {

                var summary = group.firstChild;

                while (
                    summary &&
                    !hasClass(summary, "date-summary") &&
                    !hasClass(summary, "category-summary")
                ) {
                    summary = summary.nextSibling;
                }

                if (summary) {

                    summary.onclick = function () {

                        setGroupOpen(
                            group,
                            isCollapsed(group)
                        );
                    };
                }

            }(groups[i]));
        }
    }


    /*
     * =========================================================
     * INITIALIZE
     * =========================================================
     */

    render();
    initToggles();


    document.getElementById("expandAll").onclick =
        function () {

            setAllOpen(true);

        };


    document.getElementById("collapseAll").onclick =
        function () {

            setAllOpen(false);

        };


}());
</script>

</body>
</html>
